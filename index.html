<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI File Hub</title>
<style>
  :root{--bg:#0f1115;--surface:#171a21;--surface-2:#1d2230;--border:#262b36;--text:#e6e8ee;--muted:#8b93a7;--accent:#5b8cff;--success:#3ddc97;--danger:#ff6b6b;--mono:ui-monospace,monospace;}
  *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,sans-serif;line-height:1.5}
  header{padding:2rem 1.5rem 1rem;max-width:1000px;margin:0 auto} header h1{margin:0 0 .25rem;font-size:1.5rem} header p{margin:0;color:var(--muted);font-size:.9rem}
  main{max-width:1000px;margin:0 auto;padding:0 1.5rem 4rem} .panel{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:1.25rem;margin-bottom:1.25rem}
  .panel h2{margin:0 0 .75rem;font-size:.95rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
  .row{display:flex;gap:.6rem;flex-wrap:wrap;margin-bottom:.6rem} .row label{flex:1;min-width:140px;font-size:.82rem;color:var(--muted)}
  .row input{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:.5rem .65rem;font-family:var(--mono);font-size:.85rem;margin-top:.25rem}
  .row input:focus{outline:none;border-color:var(--accent)}
  .btn{background:var(--surface-2);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:.5rem .9rem;font-size:.85rem;cursor:pointer;transition:.12s;font-family:inherit}
  .btn:hover{border-color:var(--accent);color:var(--accent-hover)} .btn-primary{background:var(--accent);border-color:var(--accent);color:#fff} .btn-primary:hover{background:#7aa2ff}
  .dropzone{border:2px dashed var(--border);border-radius:12px;padding:2rem 1rem;text-align:center;cursor:pointer;transition:.15s;background:var(--bg)}
  .dropzone:hover,.dropzone.dragover{border-color:var(--accent);background:var(--surface-2)}
  .dropzone-icon{font-size:1.8rem;margin-bottom:.4rem} .dropzone-title{font-weight:600} .dropzone-sub{color:var(--muted);font-size:.82rem;margin-top:.2rem}
  .link-box{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:.75rem 1rem;display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;margin-top:.6rem}
  .link-box a{color:var(--accent);text-decoration:none;font-family:var(--mono);font-size:.85rem;word-break:break-all;flex:1;min-width:200px}
  .file-list{display:flex;flex-direction:column;gap:.4rem;margin-top:.75rem} .file-item{display:flex;align-items:center;gap:.75rem;background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:.6rem .85rem}
  .file-icon{font-size:1.15rem;flex-shrink:0} .file-info{flex:1;min-width:0} .file-name{font-weight:600;font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .file-meta{font-size:.75rem;color:var(--muted);font-family:var(--mono);margin-top:.1rem}
  .file-actions{display:flex;gap:.35rem;flex-shrink:0} .file-actions .btn{padding:.3rem .55rem;font-size:.78rem}
  .empty{text-align:center;color:var(--muted);padding:1.5rem;border:1px dashed var(--border);border-radius:10px;font-size:.9rem;margin-top:.75rem}
  .status{padding:.6rem .9rem;border-radius:8px;font-size:.85rem;margin-top:.6rem;display:none} .status.show{display:block} .status.error{background:rgba(255,107,107,.1);border:1px solid var(--danger);color:var(--danger)} .status.success{background:rgba(61,220,151,.1);border:1px solid var(--success);color:var(--success)} .status.info{background:rgba(91,140,255,.1);border:1px solid var(--accent);color:var(--accent)}
  .hint{font-size:.78rem;color:var(--muted);margin-top:.5rem;line-height:1.5} .hint code{background:var(--bg);padding:.1rem .35rem;border-radius:4px;font-family:var(--mono)}
  .toast{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%) translateY(20px);background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:.7rem 1.1rem;font-size:.88rem;opacity:0;pointer-events:none;transition:.2s;z-index:200}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)} .toast.error{border-color:var(--danger);color:var(--danger)} .toast.success{border-color:var(--success);color:var(--success)}
</style>
</head>
<body>
<header>
  <h1>📦 AI File Hub</h1>
  <p>Загружай файлы → получай ссылку → давай её ИИ</p>
</header>
<main>
  <section class="panel">
    <h2>1. Настройки GitHub</h2>
    <div class="row">
      <label>Владелец (username)<input id="cfgOwner" placeholder="www-Profile"></label>
      <label>Репозиторий<input id="cfgRepo" placeholder="File"></label>
    </div>
    <div class="row">
      <label>Ветка<input id="cfgBranch" placeholder="main" value="main"></label>
      <label>Токен (fine-grained, Contents: RW)<input id="cfgToken" type="password" placeholder="github_pat_..."></label>
    </div>
    <div class="row">
      <button class="btn btn-primary" id="saveCfgBtn">💾 Сохранить</button>
      <button class="btn" id="testCfgBtn">🔌 Проверить подключение</button>
    </div>
    <div class="status" id="cfgStatus"></div>
  </section>

  <section class="panel">
    <h2>2. Загрузить файлы</h2>
    <div class="dropzone" id="dropzone">
      <div class="dropzone-icon">⬆️</div>
      <div class="dropzone-title">Перетащи файлы сюда</div>
      <div class="dropzone-sub">или нажми · одноимённые файлы обновляются</div>
      <input type="file" id="fileInput" multiple hidden>
    </div>
    <div class="status" id="uploadStatus"></div>
  </section>

  <section class="panel">
    <h2>3. Ссылка для ИИ</h2>
    <div class="link-box">
      <a id="shareLink" href="#" target="_blank" rel="noopener">— сначала настрой GitHub —</a>
      <button class="btn" id="copyLinkBtn">📋 Копировать</button>
      <button class="btn" id="openLinkBtn">↗ Открыть</button>
    </div>
  </section>

  <section class="panel">
    <h2>Файлы в репозитории <span id="fileCount" style="color:var(--text)"></span></h2>
    <button class="btn" id="refreshBtn">🔄 Обновить список</button>
    <button class="btn" id="regenBtn">🔁 Пересобрать all.html</button>
    <div class="file-list" id="fileList"></div>
    <div class="empty" id="empty">Файлов пока нет</div>
  </section>
</main>
<div class="toast" id="toast"></div>

<script>
const CFG_KEY = 'ai-file-hub-cfg';
const settings = { owner: '', repo: '', branch: 'main', token: '' };

function loadCfg() {
  try { const raw = localStorage.getItem(CFG_KEY); if (raw) Object.assign(settings, JSON.parse(raw)); } catch (e) {}
  document.getElementById('cfgOwner').value = settings.owner;
  document.getElementById('cfgRepo').value = settings.repo;
  document.getElementById('cfgBranch').value = settings.branch;
  document.getElementById('cfgToken').value = settings.token;
}
function saveCfg() {
  settings.owner = document.getElementById('cfgOwner').value.trim();
  settings.repo = document.getElementById('cfgRepo').value.trim();
  settings.branch = document.getElementById('cfgBranch').value.trim() || 'main';
  settings.token = document.getElementById('cfgToken').value.trim();
  localStorage.setItem(CFG_KEY, JSON.stringify(settings));
  updateShareLink();
}
function cfgReady() { return settings.owner && settings.repo && settings.token; }
function updateShareLink() {
  const a = document.getElementById('shareLink');
  if (!cfgReady()) { a.textContent = '— сначала настрой GitHub —'; a.href = '#'; return; }
  const url = `https://${settings.owner}.github.io/${settings.repo}/all.html`;
  a.textContent = url; a.href = url;
}

async function ghApi(method, path, body) {
  if (!cfgReady()) throw new Error('GitHub не настроен');
  const base = `https://api.github.com/repos/${settings.owner}/${settings.repo}/contents/${path}`;
  const url = settings.branch && method === 'GET' ? `${base}?ref=${encodeURIComponent(settings.branch)}` : base;
  const headers = { 'Authorization': `Bearer ${settings.token}`, 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' };
  if (body) headers['Content-Type'] = 'application/json';
  const res = await fetch(url, { method, headers, body: body ? JSON.stringify(body) : undefined });
  if (!res.ok) {
    let msg = `${res.status} ${res.statusText}`;
    try { const j = await res.json(); if (j.message) msg += `: ${j.message}`; } catch (e) {}
    throw new Error(msg);
  }
  if (res.status === 204) return null;
  return res.json();
}

function b64encode(str) { const bytes = new TextEncoder().encode(str); let binary = ''; for (let i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]); return btoa(binary); }
function b64decode(str) { const binary = atob(str.replace(/\s/g, '')); const bytes = new Uint8Array(binary.length); for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i); return new TextDecoder().decode(bytes); }

async function getSha(path) {
  try { const data = await ghApi('GET', path); return data.sha; } catch (e) { if (String(e.message).includes('404')) return null; throw e; }
}
async function putFile(path, content, message) {
  const sha = await getSha(path);
  const body = { message: message || `Update ${path}`, content: b64encode(content), branch: settings.branch };
  if (sha) body.sha = sha;
  return ghApi('PUT', path, body);
}
async function deleteFile(path, message) {
  const sha = await getSha(path); if (!sha) return;
  await ghApi('DELETE', path, { message: message || `Delete ${path}`, sha, branch: settings.branch });
}
async function listRepoFiles() {
  try {
    const items = await ghApi('GET', 'files');
    if (!Array.isArray(items)) return [];
    return items.filter(i => i.type === 'file').map(i => ({ name: i.name, path: i.path, size: i.size, sha: i.sha })).sort((a, b) => a.name.localeCompare(b.name));
  } catch (e) { if (String(e.message).includes('404')) return []; throw e; }
}
async function getRepoFileContent(name) {
  const data = await ghApi('GET', `files/${encodeURIComponent(name)}`);
  if (data.content && data.encoding === 'base64') return b64decode(data.content);
  if (data.download_url) { const res = await fetch(data.download_url); if (!res.ok) throw new Error(`download ${res.status}`); return await res.text(); }
  throw new Error('не удалось получить содержимое');
}

function escHtml(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtSize(b) { if (b < 1024) return b + ' B'; if (b < 1024 * 1024) return (b / 1024).toFixed(1) + ' KB'; return (b / 1024 / 1024).toFixed(2) + ' MB'; }

async function regenerateAll() {
  const files = await listRepoFiles();
  const totalSize = files.reduce((s, f) => s + f.size, 0);
  const updated = new Date().toLocaleString('ru-RU');
  const parts = [];
  parts.push(`<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><title>AI File Hub</title>
<style>body{background:#0f1115;color:#e6e8ee;font-family:system-ui,sans-serif;max-width:1100px;margin:0 auto;padding:1.5rem;line-height:1.5}
h1{margin:0 0 .3rem;font-size:1.5rem}.meta{color:#8b93a7;font-size:.88rem;margin-bottom:1.25rem;padding-bottom:1rem;border-bottom:1px solid #262b36;font-family:monospace}
.toc{background:#171a21;border:1px solid #262b36;border-radius:12px;padding:1rem 1.25rem;margin-bottom:1.25rem}
.toc h2{margin:0 0 .5rem;font-size:.8rem;text-transform:uppercase;color:#8b93a7}.toc a{display:block;color:#5b8cff;text-decoration:none;font-size:.88rem;padding:.12rem 0;font-family:monospace}
.file{background:#171a21;border:1px solid #262b36;border-radius:12px;margin-bottom:.75rem;overflow:hidden}
.file summary{padding:.75rem 1rem;cursor:pointer;display:flex;align-items:center;gap:.6rem;font-weight:600;user-select:none;font-family:monospace;font-size:.92rem}
.file summary::-webkit-details-marker{display:none}.file summary::before{content:'▸';color:#8b93a7;transition:transform .15s}.file[open] summary::before{transform:rotate(90deg)}
.file-meta{margin-left:auto;color:#8b93a7;font-size:.78rem;font-weight:400}
pre{margin:0;padding:1rem;background:#0f1115;border-top:1px solid #262b36;font-family:monospace;font-size:.8rem;overflow-x:auto;white-space:pre;line-height:1.45;tab-size:2}
</style></head><body><h1>📚 AI File Hub</h1><div class="meta">${files.length} файлов · ${fmtSize(totalSize)} · обновлено ${escHtml(updated)}</div><div class="toc"><h2>Содержание</h2>`);
  for (const f of files) { parts.push(`<a href="#file-${escHtml(f.name)}">${escHtml(f.name)} <span style="color:#8b93a7">— ${fmtSize(f.size)}</span></a>`); }
  parts.push(`</div>`);
  for (const f of files) {
    let content = ''; try { content = await getRepoFileContent(f.name); } catch (e) { content = `[ошибка: ${e.message}]`; }
    const lineCount = content.split(/\r?\n/).length;
    parts.push(`<details class="file" id="file-${escHtml(f.name)}" open><summary>${escHtml(f.name)}<span class="file-meta">${lineCount} строк · ${fmtSize(f.size)}</span></summary><pre>${escHtml(content)}</pre></details>`);
  }
  parts.push(`</body></html>`);
  await putFile('all.html', parts.join('\n'), `Update all.html (${files.length} files)`);
  return { count: files.length, size: totalSize };
}

const dropzone = document.getElementById('dropzone');
const fileInput = document.getElementById('fileInput');
const fileListEl = document.getElementById('fileList');
const emptyEl = document.getElementById('empty');
const fileCountEl = document.getElementById('fileCount');
const uploadStatus = document.getElementById('uploadStatus');
const cfgStatus = document.getElementById('cfgStatus');

let toastTimer;
function toast(msg, type = 'info') {
  const el = document.getElementById('toast');
  el.textContent = msg; el.className = 'toast show' + (type !== 'info' ? ' ' + type : '');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), 3500);
}
function setStatus(el, msg, type) { el.textContent = msg; el.className = 'status show ' + (type || 'info'); }
function clearStatus(el) { el.className = 'status'; el.textContent = ''; }
function readFileAsText(file) { return new Promise((resolve, reject) => { const r = new FileReader(); r.onload = () => resolve(r.result); r.onerror = () => reject(r.error); r.readAsText(file, 'UTF-8'); }); }
function looksBinary(text) { return /\x00/.test(text.slice(0, 8000)); }
function fileIcon(name) { const ext = (name.split('.').pop() || '').toLowerCase(); const m = {js:'🟨',html:'🟧',css:'🎨',json:'📋',md:'📝',txt:'📄',py:'🐍'}; return m[ext] || '📄'; }

document.getElementById('saveCfgBtn').addEventListener('click', () => { saveCfg(); clearStatus(cfgStatus); toast('Настройки сохранены', 'success'); });
document.getElementById('testCfgBtn').addEventListener('click', async () => {
  saveCfg(); if (!cfgReady()) { setStatus(cfgStatus, 'Заполни все поля', 'error'); return; }
  setStatus(cfgStatus, 'Проверяем…', 'info');
  try { await ghApi('GET', ''); setStatus(cfgStatus, '✅ Подключение работает', 'success'); } catch (e) { setStatus(cfgStatus, '❌ ' + e.message, 'error'); }
});

dropzone.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', e => { if (e.target.files.length) handleUpload(e.target.files); fileInput.value = ''; });
['dragenter', 'dragover'].forEach(ev => dropzone.addEventListener(ev, e => { e.preventDefault(); dropzone.classList.add('dragover'); }));
['dragleave', 'drop'].forEach(ev => dropzone.addEventListener(ev, e => { e.preventDefault(); dropzone.classList.remove('dragover'); }));
dropzone.addEventListener('drop', e => { if (e.dataTransfer.files.length) handleUpload(e.dataTransfer.files); });
['dragover', 'drop'].forEach(ev => document.addEventListener(ev, e => e.preventDefault()));

async function handleUpload(fileList) {
  if (!cfgReady()) { setStatus(uploadStatus, '❌ Сначала заполни настройки GitHub', 'error'); return; }
  const arr = Array.from(fileList); let added = 0, updated = 0, skipped = 0;
  setStatus(uploadStatus, `Загружаем 0/${arr.length}…`, 'info');
  for (let i = 0; i < arr.length; i++) {
    const file = arr[i]; setStatus(uploadStatus, `Загружаем ${i + 1}/${arr.length}: ${file.name}`, 'info');
    try {
      const text = await readFileAsText(file);
      if (looksBinary(text)) { skipped++; toast(`Пропущен ${file.name}: бинарный`, 'error'); continue; }
      const existingSha = await getSha(`files/${file.name}`);
      await putFile(`files/${file.name}`, text, existingSha ? `Update ${file.name}` : `Add ${file.name}`);
      if (existingSha) updated++; else added++;
    } catch (e) { skipped++; toast(`Ошибка ${file.name}: ${e.message}`, 'error'); }
  }
  setStatus(uploadStatus, 'Генерируем all.html…', 'info');
  try {
    const res = await regenerateAll();
    setStatus(uploadStatus, `✅ Готово: +${added} новых, ${updated} обновлено` + (skipped ? `, ${skipped} пропущено` : '') + ` · в all.html ${res.count} файлов`, 'success');
  } catch (e) { setStatus(uploadStatus, '❌ Ошибка генерации all.html: ' + e.message, 'error'); }
  await refreshFileList();
}

async function refreshFileList() {
  if (!cfgReady()) { fileListEl.innerHTML = ''; emptyEl.style.display = 'block'; emptyEl.textContent = 'Сначала настрой GitHub'; fileCountEl.textContent = ''; return; }
  try {
    const files = await listRepoFiles(); fileListEl.innerHTML = ''; fileCountEl.textContent = `(${files.length})`;
    if (files.length === 0) { emptyEl.style.display = 'block'; emptyEl.textContent = 'Файлов пока нет'; return; }
    emptyEl.style.display = 'none';
    for (const f of files) {
      const card = document.createElement('div'); card.className = 'file-item';
      card.innerHTML = `<div class="file-icon">${fileIcon(f.name)}</div><div class="file-info"><div class="file-name" title="${escHtml(f.name)}">${escHtml(f.name)}</div><div class="file-meta">${fmtSize(f.size)}</div></div><div class="file-actions"><button class="btn" data-action="delete" data-name="${escHtml(f.name)}">🗑</button></div>`;
      fileListEl.appendChild(card);
    }
  } catch (e) { emptyEl.style.display = 'block'; emptyEl.textContent = 'Ошибка: ' + e.message; }
}

fileListEl.addEventListener('click', async e => {
  const btn = e.target.closest('button[data-action]'); if (!btn) return;
  if (btn.dataset.action === 'delete') {
    const name = btn.dataset.name; if (!confirm(`Удалить ${name}?`)) return;
    try { await deleteFile(`files/${name}`, `Delete ${name}`); await regenerateAll(); toast(`Удалён ${name}`, 'success'); await refreshFileList(); } catch (err) { toast('Ошибка: ' + err.message, 'error'); }
  }
});

document.getElementById('refreshBtn').addEventListener('click', refreshFileList);
document.getElementById('regenBtn').addEventListener('click', async () => {
  if (!cfgReady()) return; toast('Генерируем all.html…');
  try { const res = await regenerateAll(); toast(`✅ all.html: ${res.count} файлов`, 'success'); } catch (e) { toast('Ошибка: ' + e.message, 'error'); }
});

document.getElementById('copyLinkBtn').addEventListener('click', async () => {
  const url = document.getElementById('shareLink').href;
  if (!url || url.endsWith('#')) { toast('Сначала настрой GitHub', 'error'); return; }
  try { await navigator.clipboard.writeText(url); toast('Ссылка скопирована', 'success'); } catch (e) { prompt('Скопируй вручную:', url); }
});
document.getElementById('openLinkBtn').addEventListener('click', () => {
  const url = document.getElementById('shareLink').href;
  if (url && !url.endsWith('#')) window.open(url, '_blank', 'noopener');
});

loadCfg();
updateShareLink();
refreshFileList();
</script>
</body>
</html>
